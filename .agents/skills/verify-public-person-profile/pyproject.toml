[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-public-person-profile"
version = "1.0.0"
description = "Evidence-grounded public person profile investigation and verification tool."
readme = "SKILL.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "requests>=2.28.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
verify-profile = "verify_public_person_profile:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["verify_public_person_profile*", "core*", "models*", "scripts*", "benchmarks*"]
