<p>问询问题4：关于境外关联方及大客户BUBLUE LLC。</p>
<p>中介机构核查意见：发行人实际控制人之子陈骞在美国留学期间与同学于2021年设立BUBLUE LLC。BUBLUE LLC 股东包括 陈骞、贺若航、胡伟康、江越祺。经核查，相关主体主要通过亚马逊平台从事跨境销售，后已进行业务规范及股权调整。</p>
