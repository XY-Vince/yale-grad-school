<h1>计算机科学与技术学院举行2021年毕业典礼暨学位着装授予仪式</h1>
<div class="news-content">
<p>2021年6月，中国科学技术大学计算机科学与技术学院举行2021年毕业典礼暨学位着装授予仪式。</p>
<p>李安然同学回顾了她在科大求学之路并感谢师长的谆谆教诲、学校学院所培养的求真、务实、修身、养德的精神。最后，她以“长风破浪会有时，直挂云帆济沧海”与全体毕业生共勉。</p>
